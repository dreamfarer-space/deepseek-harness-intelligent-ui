<svg role="img" aria-label="小鲸 holding a sign: 真实模型实测！" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="150" height="200" overflow="visible">
  <defs>
    <linearGradient id="eyeGrad" x1="0" y1="-1" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2b6b" stop-opacity="0"/><stop offset="1" stop-color="#5b7cff"/>
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d95ff"/><stop offset=".6" stop-color="#4d6bfe"/><stop offset="1" stop-color="#3651d8"/>
    </linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#3b4fbf" stop-opacity=".22"/><stop offset="1" stop-color="#3b4fbf" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="150" cy="392" rx="91.0" ry="12" fill="url(#shadow)"/>
  <g transform="translate(0 0.95)">
    <!-- whale tail behind -->
    <g transform="rotate(3.1 206 318)">
      <path d="M200 320 q40 0 58 -28" stroke="#4d6bfe" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M254 296 q-6 -30 -30 -40 q24 -2 36 18 q10 -22 36 -20 q-22 12 -26 40 z" fill="url(#hoodGrad)" stroke="#22305f" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <!-- legs -->
    <g stroke="#22305f" stroke-width="4" stroke-linejoin="round">
      <rect x="122" y="336" width="20" height="36" rx="8" fill="#ffe9df"/>
      <rect x="158" y="336" width="20" height="36" rx="8" fill="#ffe9df"/>
      <path d="M116 366 h30 q4 16 -6 18 h-22 q-8 -4 -2 -18 z" fill="#4d6bfe"/>
      <path d="M154 366 h30 q6 14 -2 18 h-22 q-10 -2 -6 -18 z" fill="#4d6bfe"/>
    </g>
    <!-- dress -->
    <path d="M112 258 q38 -14 76 0 l30 86 q-68 22 -136 0 z" fill="#ffffff" stroke="#22305f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M90 334 q60 18 120 0 l8 10 q-68 22 -136 0 z" fill="#dfe7ff"/>
    <path d="M96 326 q12 8 24 0 q12 8 24 0 q12 8 24 0 q12 8 24 0 q12 8 24 0" stroke="#4d6bfe" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- sailor collar + bow -->
    <path d="M114 256 q36 34 72 0 l8 18 q-44 34 -88 0 z" fill="#4d6bfe" stroke="#22305f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M121 266 q29 22 58 0" stroke="#fff" stroke-width="3" fill="none"/>
    <g transform="translate(150 284)" stroke="#22305f" stroke-width="3.5" stroke-linejoin="round">
      <path d="M0 0 l-22 -12 v24 z" fill="#ff7a93"/><path d="M0 0 l22 -12 v24 z" fill="#ff7a93"/>
      <circle r="6" fill="#ff5d7c"/>
    </g>
    
    <!-- back hair -->
    <path d="M58 186 q-6 70 30 92 q-4 -40 8 -60 z M242 186 q6 70 -30 92 q4 -40 -8 -60 z" fill="#3a55e6" stroke="#22305f" stroke-width="4" stroke-linejoin="round"/>
    <!-- face -->
    <ellipse cx="150" cy="176" rx="88" ry="80" fill="#ffe9df" stroke="#22305f" stroke-width="4"/>
    <ellipse cx="150" cy="232" rx="54" ry="12" fill="#f8d3c6" opacity=".5"/>
    <g stroke="#1d2b6b" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M96 182 q16 -20 32 0"/><path d="M172 182 q16 -20 32 0"/></g>
    <ellipse cx="94" cy="208" rx="15" ry="8" fill="#ff9fb0" opacity=".7"/>
    <ellipse cx="206" cy="208" rx="15" ry="8" fill="#ff9fb0" opacity=".7"/>
    <path d="M136 208 q14 10.0 28 0 z" fill="#c9455f" stroke="#22305f" stroke-width="3" stroke-linejoin="round"/>
        <path d="M142 213.5 q8 3.5 16 0" fill="#ff93a6"/>
    
    <!-- bangs -->
    <path d="M64 162 q4 -60 86 -66 q82 6 86 66 q-14 -14 -26 -18 q2 14 -6 24 q-10 -22 -30 -30 q0 16 -10 24 q-8 -20 -18 -26 q-6 18 -22 24 q0 -16 -8 -26 q-18 10 -24 28 q-8 -10 -6 -24 q-12 6 -22 22 z" fill="#3a55e6" stroke="#22305f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M104 116 q22 -14 46 -14" stroke="#8ea3ff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
    <!-- whale hood -->
    <path d="M50 158 q-6 -96 100 -104 q106 8 100 104 q-18 -58 -100 -62 q-82 4 -100 62 z" fill="url(#hoodGrad)" stroke="#22305f" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M56 150 q10 -40 50 -54" stroke="#fff" stroke-width="4" fill="none" opacity=".35" stroke-linecap="round"/>
    <path d="M62 158 q88 -40 176 0" stroke="#eef3ff" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M66 160 q84 -34 168 0" stroke="#3651d8" stroke-width="2" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>
    <!-- hood fins -->
    <path d="M58 122 q-30 -6 -40 16 q22 -4 38 6 z" fill="#4d6bfe" stroke="#22305f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M242 122 q30 -6 40 16 q-22 -4 -38 6 z" fill="#4d6bfe" stroke="#22305f" stroke-width="4" stroke-linejoin="round"/>
    <!-- hood eye + smile (the whale) -->
    <circle cx="96" cy="96" r="5.5" fill="#22305f"/><circle cx="94" cy="94" r="1.8" fill="#fff"/>
    <path d="M82 112 q10 8 22 2" stroke="#22305f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- spout -->
    <g transform="translate(150 54)" opacity="0.53">
      <path d="M0 0 v-16.8" stroke="#8fd3ff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-14" cy="-20.8" r="6.6" fill="#8fd3ff" stroke="#22305f" stroke-width="3"/>
      <circle cx="0" cy="-31.4" r="7.6" fill="#8fd3ff" stroke="#22305f" stroke-width="3"/>
      <circle cx="14" cy="-20.8" r="6.6" fill="#8fd3ff" stroke="#22305f" stroke-width="3"/>
    </g>
    <g>
        <rect x="58" y="252" width="184" height="96" rx="18" fill="#fff" stroke="#22305f" stroke-width="5"/>
        <rect x="66" y="260" width="168" height="80" rx="12" fill="#eef3ff"/>
        <text x="150" y="292" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-weight="800" font-size="24" fill="#3651d8">真实模型</text>
        <text x="150" y="324" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-weight="800" font-size="24" fill="#ff7a93">实测！</text>
        <circle cx="70" cy="300" r="13" fill="#ffe9df" stroke="#22305f" stroke-width="4"/>
        <circle cx="230" cy="300" r="13" fill="#ffe9df" stroke="#22305f" stroke-width="4"/></g>
  </g>
</svg>