    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.58;.62;.9;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(640 154)">
    <rect width="250" height="38" rx="10" fill="#111833" stroke="#f87171" stroke-opacity=".4"/>
    <text x="16" y="24" font-size="13" class="mono" fill="#e8ecff">localStorage</text>
    <text x="236" y="24" font-size="12" text-anchor="end" fill="#f87171">✕ SecurityError</text>
  </g>
  <path d="M320 290 C 480 290, 460 222, 580 222" fill="none" stroke="#f87171" stroke-opacity=".25" stroke-dasharray="4 5"/>
  <circle r="5" fill="#f87171" opacity="0">
    <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M320 290 C 480 290, 460 222, 580 222" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.59;.6;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
