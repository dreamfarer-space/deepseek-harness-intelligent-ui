  </g>
  <path d="M320 310 C 480 310, 460 272, 580 272" fill="none" stroke="#f87171" stroke-opacity=".25" stroke-dasharray="4 5"/>
  <circle r="5" fill="#f87171" opacity="0">
    <animateMotion dur="2.4s" begin="1.7999999999999998s" repeatCount="indefinite" path="M320 310 C 480 310, 460 272, 580 272" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear"/>
