<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
<title id="t">安全模型</title>
<desc id="d">组件运行在不透明源的沙箱 iframe 中，并受严格 CSP 约束。访问宿主页面会被拦截，只有通过 token 校验的 postMessage 才能到达限流的 Bridge。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#141b3c"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#4d6bfe"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .dash { animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  </style>
<rect width="1200" height="460" rx="20" fill="url(#bg)"/>
<rect width="1200" height="460" rx="20" fill="url(#grid)"/>

<text x="40" y="40" font-size="13" font-weight="700" fill="#5f6a98" letter-spacing="2">安全模型</text>
<text x="1160" y="40" font-size="13" text-anchor="end" fill="#97a1c9">DSH Web 页面（宿主）</text>

<rect x="60" y="90" width="520" height="330" rx="16" fill="#a78bfa" fill-opacity=".05" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="7 5" class="dash"/>
<text x="80" y="116" font-size="12.5" class="mono" fill="#a78bfa">&lt;iframe sandbox="allow-scripts allow-forms" srcdoc&gt;</text>
<text x="80" y="136" font-size="12" fill="#97a1c9">不加 allow-same-origin → window.origin === "null"</text>

<rect x="84" y="150" width="472" height="250" rx="12" fill="#f472b6" fill-opacity=".05" stroke="#f472b6" stroke-opacity=".6"/>
<text x="100" y="172" font-size="12" class="mono" fill="#f472b6">CSP default-src 'none' · connect-src 'none'</text>
<text x="100" y="190" font-size="12" fill="#97a1c9">脚本、样式、字体、图片只能来自 cdnAllowlist</text>

<path d="M220 340 V380 Q 220 380 240 380 H640 M890 380 H930" fill="none" stroke="#34d399" stroke-opacity=".45" stroke-width="2"/>

  <path d="M320 250 C 480 250, 460 122, 580 122" fill="none" stroke="#f87171" stroke-opacity=".25" stroke-dasharray="4 5"/>
