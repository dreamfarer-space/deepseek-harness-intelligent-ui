  </circle>
  <g transform="translate(580 272)" opacity="0">
    <circle r="12" fill="#f87171" fill-opacity=".25" stroke="#f87171"/>
    <path d="M-4.5 -4.5L4.5 4.5M4.5 -4.5L-4.5 4.5" stroke="#f87171" stroke-width="2.4" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.58;.62;.9;1" dur="2.4s" begin="1.7999999999999998s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(640 254)">
    <rect width="250" height="38" rx="10" fill="#111833" stroke="#f87171" stroke-opacity=".4"/>
    <text x="16" y="24" font-size="13" class="mono" fill="#e8ecff">fetch(…)</text>
    <text x="236" y="24" font-size="12" text-anchor="end" fill="#f87171">✕ 已拦截</text>
  </g>

<g>
  <rect x="120" y="220" width="200" height="120" rx="12" fill="#18213f" stroke="#22d3ee"/>
  <text x="138" y="250" font-size="15" font-weight="700" fill="#e8ecff">组件代码</text>
  <text x="138" y="274" font-size="12" class="mono" fill="#97a1c9">UI.three · UI.canvas</text>
  <text x="138" y="294" font-size="12" class="mono" fill="#97a1c9">UI.state · Bridge.*</text>
  <g transform="translate(290 312)">
    <path d="M-10 0a10 10 0 1 0 20 0a10 10 0 1 0 -20 0" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 3.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</g>

<g>
  <rect x="640" y="320" width="250" height="100" rx="14" fill="#34d399" fill-opacity=".08" stroke="#34d399"/>
  <text x="658" y="348" font-size="14" font-weight="700" fill="#34d399">postMessage 校验</text>
  <text x="658" y="370" font-size="12" fill="#97a1c9">来源必须是该 iframe</text>
  <text x="658" y="388" font-size="12" fill="#97a1c9">每个 iframe 独立随机 token</text>
  <text x="658" y="406" font-size="12" fill="#97a1c9">格式校验，大小受限</text>
</g>
<g>
  <rect x="930" y="320" width="230" height="100" rx="14" fill="#4d6bfe" fill-opacity=".12" stroke="#4d6bfe"/>
  <text x="948" y="348" font-size="14" font-weight="700" fill="#e8ecff">宿主 Bridge</text>
  <text x="948" y="370" font-size="12" class="mono" fill="#22d3ee">sendPrompt · openLink</text>
  <text x="948" y="390" font-size="12" fill="#97a1c9">挂载后 1 秒内拒绝发送</text>
  <text x="948" y="408" font-size="12" fill="#97a1c9">每 2 秒最多 1 次 · 限长</text>
</g>
<g transform="translate(930 104)">
  <rect width="230" height="188" rx="14" fill="#111833" stroke="#2a3563"/>
  <text x="18" y="30" font-size="14" font-weight="700" fill="#e8ecff">DSH 页面</text>
  <text x="18" y="54" font-size="12" fill="#97a1c9">会话、cookie、存储、</text>
  <text x="18" y="74" font-size="12" fill="#97a1c9">API 均无法触及</text>
  <rect x="18" y="96" width="194" height="10" rx="5" fill="#2a3563"/>
  <rect x="18" y="116" width="150" height="10" rx="5" fill="#2a3563"/>
  <rect x="18" y="136" width="170" height="10" rx="5" fill="#2a3563"/>
  <text x="18" y="172" font-size="12" fill="#34d399">🔒 由 E2E 测试实测验证</text>
</g>

