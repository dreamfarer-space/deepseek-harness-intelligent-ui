name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      number:
        description: 'PR number to process'
        required: true
        type: string
      dry_run:
        description: 'Inspect without publishing labels/review'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-${{ github.event.pull_request.number || inputs.number }}
  cancel-in-progress: true

jobs:
  bot:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always run the default-branch bot code; a stale PR base must never execute
      # an older workflow. PR content is only read through the GitHub API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify automation boundaries
        run: python .github/automation/test_bot.py
      - name: Run AI PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL || 'https://api.zemengzhou.com/v1' }}
          ISSUE_LABEL_MODEL: ${{ vars.ISSUE_LABEL_MODEL || 'gemini-3.8-flash-high' }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL || 'gemini-3.8-flash-high' }}
          BOT_MODE: pr
          TARGET_NUMBER: ${{ github.event.pull_request.number || inputs.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python .github/automation/bot.py
