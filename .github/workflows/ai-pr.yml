name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      number:
        description: 'PR number to process'
        required: true
        type: string
      dry_run:
        description: 'Inspect without publishing labels/review'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-${{ github.event.pull_request.number || inputs.number }}
  cancel-in-progress: false

jobs:
  bot:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only trusted base code is checked out; PR code is read as API data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify automation boundaries
        run: python .github/automation/test_bot.py
      - name: Run AI PR Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL || 'https://api.zemengzhou.com/v1' }}
          ISSUE_LABEL_MODEL: ${{ vars.ISSUE_LABEL_MODEL || 'gemini-3.8-flash-high' }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL || 'gemini-3.8-flash-high' }}
          BOT_MODE: pr
          TARGET_NUMBER: ${{ github.event.pull_request.number || inputs.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python .github/automation/bot.py
