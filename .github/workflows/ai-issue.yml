name: AI Issue Labeler

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      number:
        description: 'ISSUE number to process'
        required: true
        type: string
      dry_run:
        description: 'Inspect without publishing labels/review'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-issue-${{ github.event.issue.number || inputs.number }}
  cancel-in-progress: false

jobs:
  bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only trusted base code is checked out; PR code is read as API data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify automation boundaries
        run: python .github/automation/test_bot.py
      - name: Run AI Issue Labeler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL || 'https://api.zemengzhou.com/v1' }}
          ISSUE_LABEL_MODEL: ${{ vars.ISSUE_LABEL_MODEL || 'gemini-3.8-flash-high' }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL || 'gemini-3.8-flash-high' }}
          BOT_MODE: issue
          TARGET_NUMBER: ${{ github.event.issue.number || inputs.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python .github/automation/bot.py
