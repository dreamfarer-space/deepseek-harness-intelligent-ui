name: AI Issue Labeler

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      number:
        description: 'ISSUE number to process'
        required: true
        type: string
      dry_run:
        description: 'Inspect without publishing labels/review'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-issue-${{ github.event.issue.number || inputs.number }}
  cancel-in-progress: false

jobs:
  bot:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/bot-provider-diagnostics')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only trusted base code is checked out; PR code is read as API data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify automation boundaries
        run: python .github/automation/test_bot.py
      - name: Install official Codex CLI
        run: npm install --global @openai/codex@0.155.1 --no-audit --no-fund
      - name: Run AI Issue Labeler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTROUTER_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
          AGENTROUTER_BASE_URL: ${{ vars.AGENTROUTER_BASE_URL || 'https://agentrouter.org/v1' }}
          ISSUE_LABEL_MODEL: ${{ vars.ISSUE_LABEL_MODEL || 'gpt-6.1-sol' }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL || 'gpt-6.1-sol' }}
          BOT_MODE: issue
          TARGET_NUMBER: ${{ github.event.issue.number || inputs.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python .github/automation/bot.py
