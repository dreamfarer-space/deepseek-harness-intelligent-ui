name: Release

# Push a tag made by `npm version` (vX.Y.Z or vX.Y.Z-rc.N):
#   preflight → full CI matrix → npm publish (with provenance) → smoke-test the
#   published package on 3 OSes → GitHub Release with the changelog notes and tarball.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist-tag: ${{ steps.meta.outputs.dist-tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: git fetch origin main:refs/remotes/origin/main
      - run: node scripts/ci/release-check.mjs --tag "$GITHUB_REF_NAME" --main-ref origin/main
      - id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # provenance and, when configured, npm Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Pin a CLI that supports OIDC; do not rely on setup-node's bundled npm.
      - run: npm install -g npm@11.9.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run build && git diff --exit-code -- client/client.js
      - name: Publish ${{ needs.preflight.outputs.version }} as "${{ needs.preflight.outputs.dist-tag }}"
        run: node scripts/ci/registry-release.mjs publish
        env:
          # Keep the working token path until npm account setup is complete.
          # Enabling the variable clears the token, so OIDC failure cannot fall
          # back silently to the legacy credential. See docs/releasing.md.
          NODE_AUTH_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING != 'true' && secrets.NPM_TOKEN || '' }}
          # npm reports OIDC token-exchange failures only at verbose level; without
          # this an npm-side Trusted Publisher mismatch surfaces as a bare ENEEDAUTH.
          NPM_CONFIG_LOGLEVEL: verbose

  verify-published:
    needs: [preflight, publish]
    name: published · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10
      - run: npm ci --no-audit --no-fund
      - run: npm install -g @deepseek-ai/dsh@latest --no-audit --no-fund
      - name: Install the published package from the registry (registry propagation can lag)
        run: |
          spec="$(node -p "require('./package.json').name")@${{ needs.preflight.outputs.version }}"
          for i in 1 2 3 4 5 6; do npm view "$spec" version && break; echo "waiting for $spec…"; sleep 20; done
          node scripts/ci/smoke.mjs --spec "$spec" --expected-version "${{ needs.preflight.outputs.version }}"

  github-release:
    needs: [preflight, verify-published]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/release-check.mjs --tag "$GITHUB_REF_NAME" --notes release-notes.md
      - run: npm run build && git diff --exit-code -- client/client.js
      - name: Download and verify the exact npm tarball
        run: node scripts/ci/registry-release.mjs verify
      - name: Create GitHub Release
        run: node scripts/ci/registry-release.mjs github-asset
        env:
          GH_TOKEN: ${{ github.token }}
